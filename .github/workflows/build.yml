name: build

on:
  push:
  workflow_dispatch:

jobs:
  tico-module:
    runs-on: ubuntu-latest
    container: ghcr.io/autorunhq/switch-dev:2026.10.12
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          command -v apt-get >/dev/null && { apt-get update -qq; apt-get install -y -qq zip python3 cmake ninja-build git curl >/dev/null; } || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for tool in zip python3 cmake ninja git curl; do command -v $tool || echo "missing $tool"; done
          ls /opt/devkitpro/portlibs/switch/lib | grep -E 'vulkan|EGL|GLES|ntfs|curl|sodium|usbhsfs' || true

      - name: Build
        run: bash tools/build_tico.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tico-nethersx2_sd
          path: out/sd/

      - uses: actions/upload-artifact@v4
        with:
          name: tico-nethersx2_debug
          path: |
            out/tico-nethersx2.elf
            out/tico-nethersx2.map
